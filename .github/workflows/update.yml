
name: GundemRadar - 6 saatte bir guncelle

on:
  schedule:
    - cron: '17 3,9,15,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python testleri
        run: python -m unittest discover -s tests -v

      - name: Guncel veriyi topla
        run: python scripts/collect.py --source auto

      - name: Verileri kaydet
        run: |
          git config user.name "gundemradar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/rankings.json
          if ! git diff --cached --quiet; then
            git commit -m "data: 6 saatlik gundem yenilemesi"
            git push
          fi
